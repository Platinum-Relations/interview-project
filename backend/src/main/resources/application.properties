spring.application.name=reconciliation

# H2 in file mode: persists to backend/.data so results survive a restart.
spring.datasource.url=jdbc:h2:file:./.data/reconciliation;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# H2 console for inspection during development (http://localhost:8080/h2-console)
spring.h2.console.enabled=true

server.port=8080

# The published fee schedule; overridable so tests or another deployment can swap it.
reconciliation.fee-schedule=file:../fee_schedule.json

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=25MB
